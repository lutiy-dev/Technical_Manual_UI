name: Wire Module Contract practice lab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-module-contract-lab.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Wire LAB 03 into route order
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('lib/manual-data.ts')
          text = p.read_text(encoding='utf-8')
          old = "  additionalChapter('workflow-engineering-base-config-lab'),\n  additionalChapter('workflow-engineering-module-contracts'),"
          new = "  additionalChapter('workflow-engineering-base-config-lab'),\n  additionalChapter('workflow-engineering-module-contract-lab'),\n  additionalChapter('workflow-engineering-module-contracts'),"
          if new not in text:
              if old not in text:
                  raise SystemExit('LAB 03 insertion point not found')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = re.sub(
              r'Сайт разбит на \d+ (?:отдельных маршрутов|отдельный маршрут|отдельных маршрута)',
              'Сайт разбит на 43 отдельных маршрута',
              text,
              count=1,
          )
          text = text.replace(
              'LAB 01 Routing Sandbox, LAB 02 BASE CONFIG, modules, contracts, checkpoints и reproducibility.',
              'LAB 01 Routing Sandbox, LAB 02 BASE CONFIG, LAB 03 Module Contract, modules, contracts, checkpoints и reproducibility.',
          )
          p.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Remove temporary patch workflow
        run: rm .github/workflows/patch-module-contract-lab.yml

      - name: Commit route wiring and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/manual-data.ts README.md .github/workflows/patch-module-contract-lab.yml
          git commit -m "feat: expose module contract practice lab"
          git push
