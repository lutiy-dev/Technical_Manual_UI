name: Wire Execution Model chapter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-execution-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Wire chapter into route order
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('lib/manual-data.ts')
          text = p.read_text(encoding='utf-8')
          old = "  additionalChapter('workflow-engineering-switches-routing'),\n  additionalChapter('workflow-engineering-module-contracts'),"
          new = "  additionalChapter('workflow-engineering-switches-routing'),\n  additionalChapter('workflow-engineering-execution-cache'),\n  additionalChapter('workflow-engineering-module-contracts'),"
          if new not in text:
              if old not in text:
                  raise SystemExit('Execution chapter insertion point not found')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = re.sub(
              r'Сайт разбит на \d+ (?:отдельных маршрутов|отдельный маршрут|отдельных маршрута)',
              'Сайт разбит на 40 отдельных маршрутов',
              text,
              count=1,
          )
          text = text.replace(
              'switches/selectors/bypass, modules, contracts, checkpoints и reproducibility.',
              'switches/selectors/bypass, execution/queue/cache, modules, contracts, checkpoints и reproducibility.',
          )
          p.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit route wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/manual-data.ts README.md
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "feat: expose execution model chapter"
          git push
