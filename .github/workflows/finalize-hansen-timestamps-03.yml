name: Finalize Hansen timestamp lessons 03

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-hansen-timestamps-03.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Wire final Hansen timestamp block
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('lib/manual/index.ts')
          text = p.read_text(encoding='utf-8')
          if "./hansen-timestamps-03" not in text:
              text = text.replace(
                  "import { hansenTimestampChapters02 } from './hansen-timestamps-02';\n",
                  "import { hansenTimestampChapters02 } from './hansen-timestamps-02';\nimport { hansenTimestampChapters03 } from './hansen-timestamps-03';\n",
                  1,
              )
          if "...hansenTimestampChapters03," not in text:
              text = text.replace(
                  "  ...hansenTimestampChapters02,\n  ...peoplePplWorkflow01Chapters,",
                  "  ...hansenTimestampChapters02,\n  ...hansenTimestampChapters03,\n  ...peoplePplWorkflow01Chapters,",
                  1,
              )
          if "  hansenTimestampChapters03,\n" not in text.split('export {', 1)[1]:
              text = text.replace(
                  "  hansenTimestampChapters02,\n  peoplePplAdditions,",
                  "  hansenTimestampChapters02,\n  hansenTimestampChapters03,\n  peoplePplAdditions,",
                  1,
              )
          p.write_text(text, encoding='utf-8')

          p = Path('lib/manual-data.ts')
          text = p.read_text(encoding='utf-8')
          marker = "  additionalChapter('hansen-07-38-masks-detail-conservation'),\n  peopleOverview,"
          replacement = (
              "  additionalChapter('hansen-07-38-masks-detail-conservation'),\n"
              "  additionalChapter('hansen-08-35-mode1-example'),\n"
              "  additionalChapter('hansen-09-16-generation-mode1'),\n"
              "  additionalChapter('hansen-11-35-mode2-img2img'),\n"
              "  additionalChapter('hansen-12-53-generation-mode2'),\n"
              "  additionalChapter('hansen-13-20-mode2-enhancement'),\n"
              "  additionalChapter('hansen-13-55-output-parameters'),\n"
              "  additionalChapter('hansen-14-43-conclusion'),\n"
              "  peopleOverview,"
          )
          if "additionalChapter('hansen-08-35-mode1-example')" not in text:
              if marker not in text:
                  raise SystemExit('manual-data final timestamp insertion point not found')
              text = text.replace(marker, replacement, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = re.sub(
              r'Сайт разбит на \d+ отдельных маршру(?:тов|та), объединённых в семь групп:',
              'Сайт разбит на 59 отдельных маршрутов, объединённых в семь групп:',
              text,
              count=1,
          )
          text = re.sub(
              r'3\. \*\*Part III · Hansen by Timestamps\*\* — .*?Главная цель — универсальная логика ComfyUI, а не каталог моделей\.',
              '3. **Part III · Hansen by Timestamps** — полный production-first reverse engineering showcase: 00:39 Production Method → 01:08 Input Data → 02:40 Process 1 → 04:23 PEOPLE → 05:42 Workflow Tips → 06:32 ControlNet → 07:38 Masks/Detail → 08:35 Mode 1 Example → 09:16 Generation Mode 1 → 11:35 Mode 2 IMG2IMG → 12:53 Generation Mode 2 → 13:20 Enhancement → 13:55 Output → 14:43 Conclusion. Главная цель — универсальная логика ComfyUI, а не каталог моделей.',
              text,
              count=1,
          )
          text = re.sub(
              r'Current Hansen timestamp coverage: \*\*[^*]+\*\*\.[^\n]*',
              'Current Hansen timestamp coverage: **00:39 → 14:43 · COMPLETE**. Таймкодный разбор showcase закрыт; дальше учебник используется как фундамент для самостоятельного освоения новых моделей и modules.',
              text,
              count=1,
          )
          p.write_text(text, encoding='utf-8')

          mi = Path('lib/manual/index.ts').read_text(encoding='utf-8')
          md = Path('lib/manual-data.ts').read_text(encoding='utf-8')
          assert 'hansenTimestampChapters03' in mi
          for slug in [
              'hansen-08-35-mode1-example',
              'hansen-09-16-generation-mode1',
              'hansen-11-35-mode2-img2img',
              'hansen-12-53-generation-mode2',
              'hansen-13-20-mode2-enhancement',
              'hansen-13-55-output-parameters',
              'hansen-14-43-conclusion',
          ]:
              assert md.count(f"additionalChapter('{slug}')") == 1

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Remove temporary finalizer
        run: rm .github/workflows/finalize-hansen-timestamps-03.yml

      - name: Commit finalized timestamp block
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/manual/index.ts lib/manual-data.ts README.md .github/workflows/finalize-hansen-timestamps-03.yml
          git commit -m "feat: complete Hansen timestamp lessons through 14-43"
          git push
