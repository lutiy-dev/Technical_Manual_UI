name: Patch Workflow Engineering stage 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-workflow-engineering-stage1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Wire Workflow Engineering stage 1
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected marker not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Register Graph Literacy in the manual registry if not already present.
          p = Path('lib/manual/index.ts')
          text = p.read_text(encoding='utf-8')
          if "workflowEngineeringGraphLiteracyChapters" not in text:
              text = text.replace(
                  "import { workflowEngineeringNodeLiteracyChapters } from './workflow-engineering-node-literacy';",
                  "import { workflowEngineeringNodeLiteracyChapters } from './workflow-engineering-node-literacy';\nimport { workflowEngineeringGraphLiteracyChapters } from './workflow-engineering-graph-literacy';",
                  1,
              )
              text = text.replace(
                  "  ...workflowEngineeringNodeLiteracyChapters,\n  ...foundationChapters,",
                  "  ...workflowEngineeringNodeLiteracyChapters,\n  ...workflowEngineeringGraphLiteracyChapters,\n  ...foundationChapters,",
                  1,
              )
              text = text.replace(
                  "  workflowEngineeringNodeLiteracyChapters,\n};",
                  "  workflowEngineeringNodeLiteracyChapters,\n  workflowEngineeringGraphLiteracyChapters,\n};",
                  1,
              )
          p.write_text(text, encoding='utf-8')

          # Ensure both chapters are in route order before Hansen/Foundation.
          p = Path('lib/manual-data.ts')
          text = p.read_text(encoding='utf-8')
          old = "  additionalChapter('workflow-engineering-overview'),\n  additionalChapter('overview'),"
          new = "  additionalChapter('workflow-engineering-overview'),\n  additionalChapter('workflow-engineering-node-literacy'),\n  additionalChapter('workflow-engineering-graph-literacy'),\n  additionalChapter('overview'),"
          if new not in text:
              # Handle case where Node Literacy was already added by older patch.
              old2 = "  additionalChapter('workflow-engineering-overview'),\n  additionalChapter('workflow-engineering-node-literacy'),\n  additionalChapter('overview'),"
              if old2 in text:
                  text = text.replace(old2, new, 1)
              elif old in text:
                  text = text.replace(old, new, 1)
              else:
                  raise SystemExit('manualChapters Workflow Engineering marker not found')
          p.write_text(text, encoding='utf-8')

          # Keep overview cross-links aligned.
          p = Path('lib/manual/workflow-engineering.ts')
          text = p.read_text(encoding='utf-8')
          marker = "    relatedChapters: [\n"
          block = "    relatedChapters: [\n      'workflow-engineering-node-literacy',\n      'workflow-engineering-graph-literacy',\n"
          if block not in text:
              if "      'workflow-engineering-node-literacy',\n" in text:
                  text = text.replace(
                      "    relatedChapters: [\n      'workflow-engineering-node-literacy',\n",
                      block,
                      1,
                  )
              else:
                  text = text.replace(marker, block, 1)
          p.write_text(text, encoding='utf-8')

          # Route count after Overview + Node Literacy + Graph Literacy = 32.
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          import re
          text = re.sub(r'Сайт разбит на \d+ (?:отдельных маршрутов|отдельный маршрут|отдельных маршрута)', 'Сайт разбит на 32 отдельных маршрута', text, count=1)
          p.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify generated routes
        shell: bash
        run: |
          find dist/client -maxdepth 4 -type f | grep -q 'workflow-engineering-node-literacy'
          find dist/client -maxdepth 4 -type f | grep -q 'workflow-engineering-graph-literacy'

      - name: Commit stage 1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/manual/index.ts lib/manual-data.ts lib/manual/workflow-engineering.ts README.md
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "feat: complete Workflow Engineering literacy stage"
          git push
