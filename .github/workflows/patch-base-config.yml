name: Wire BASE CONFIG chapter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-base-config.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Wire BASE CONFIG route
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('lib/manual-data.ts')
          text = p.read_text(encoding='utf-8')
          old = "  additionalChapter('workflow-engineering-graph-literacy'),\n  additionalChapter('overview'),"
          new = "  additionalChapter('workflow-engineering-graph-literacy'),\n  additionalChapter('workflow-engineering-base-config'),\n  additionalChapter('overview'),"
          if new not in text:
              if old not in text:
                  raise SystemExit('BASE CONFIG insertion point not found')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('lib/manual/workflow-engineering.ts')
          text = p.read_text(encoding='utf-8')
          if "      'workflow-engineering-base-config'," not in text:
              text = text.replace(
                  "      'workflow-engineering-graph-literacy',\n",
                  "      'workflow-engineering-graph-literacy',\n      'workflow-engineering-base-config',\n",
                  1,
              )
          p.write_text(text, encoding='utf-8')

          p = Path('lib/manual/workflow-engineering-graph-literacy.ts')
          text = p.read_text(encoding='utf-8')
          if "      'workflow-engineering-base-config'," not in text:
              text = text.replace(
                  "      'control-panel',\n",
                  "      'control-panel',\n      'workflow-engineering-base-config',\n",
                  1,
              )
          p.write_text(text, encoding='utf-8')

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = re.sub(
              r'Сайт разбит на \d+ (?:отдельных маршрутов|отдельный маршрут|отдельных маршрута)',
              'Сайт разбит на 33 отдельных маршрута',
              text,
              count=1,
          )
          p.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit BASE CONFIG route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/manual-data.ts lib/manual/workflow-engineering.ts lib/manual/workflow-engineering-graph-literacy.ts README.md
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "feat: expose BASE CONFIG in Workflow Engineering"
          git push
