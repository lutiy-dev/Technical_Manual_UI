name: Wire Data Plane vs Control Plane chapter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-data-control-plane.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Wire Data/Control Plane route
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('lib/manual-data.ts')
          text = p.read_text(encoding='utf-8')
          old = "  additionalChapter('workflow-engineering-base-config'),\n  additionalChapter('overview'),"
          new = "  additionalChapter('workflow-engineering-base-config'),\n  additionalChapter('workflow-engineering-data-control-plane'),\n  additionalChapter('overview'),"
          if new not in text:
              if old not in text:
                  raise SystemExit('Data/Control Plane insertion point not found')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('lib/manual/workflow-engineering-base-config.ts')
          text = p.read_text(encoding='utf-8')
          if "      'workflow-engineering-data-control-plane'," not in text:
              text = text.replace(
                  "      'models-dependencies',\n",
                  "      'models-dependencies',\n      'workflow-engineering-data-control-plane',\n",
                  1,
              )
          p.write_text(text, encoding='utf-8')

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = re.sub(
              r'Сайт разбит на \d+ (?:отдельных маршрутов|отдельный маршрут|отдельных маршрута)',
              'Сайт разбит на 34 отдельных маршрута',
              text,
              count=1,
          )
          p.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit Data/Control Plane route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/manual-data.ts lib/manual/workflow-engineering-base-config.ts README.md
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "feat: expose Data Plane vs Control Plane"
          git push
