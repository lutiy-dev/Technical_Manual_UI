name: Finalize Hansen timestamp lessons 02

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-hansen-timestamps-02.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Wire second Hansen timestamp block
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('lib/manual/index.ts')
          text = p.read_text(encoding='utf-8')
          if "./hansen-timestamps-02" not in text:
              text = text.replace(
                  "import { hansenTimestampChapters01 } from './hansen-timestamps-01';\n",
                  "import { hansenTimestampChapters01 } from './hansen-timestamps-01';\nimport { hansenTimestampChapters02 } from './hansen-timestamps-02';\n",
                  1,
              )
          if "...hansenTimestampChapters02," not in text:
              text = text.replace(
                  "  ...hansenTimestampChapters01,\n  ...peoplePplWorkflow01Chapters,",
                  "  ...hansenTimestampChapters01,\n  ...hansenTimestampChapters02,\n  ...peoplePplWorkflow01Chapters,",
                  1,
              )
          if "  hansenTimestampChapters02,\n" not in text.split('export {', 1)[1]:
              text = text.replace(
                  "  hansenTimestampChapters01,\n  peoplePplAdditions,",
                  "  hansenTimestampChapters01,\n  hansenTimestampChapters02,\n  peoplePplAdditions,",
                  1,
              )
          p.write_text(text, encoding='utf-8')

          p = Path('lib/manual-data.ts')
          text = p.read_text(encoding='utf-8')
          marker = "  additionalChapter('hansen-02-40-process1-txt2img'),\n  peopleOverview,"
          replacement = (
              "  additionalChapter('hansen-02-40-process1-txt2img'),\n"
              "  additionalChapter('hansen-04-23-people-ppl'),\n"
              "  additionalChapter('hansen-05-42-workflow-tips'),\n"
              "  additionalChapter('hansen-06-32-controlnet-preprocessors'),\n"
              "  additionalChapter('hansen-07-38-masks-detail-conservation'),\n"
              "  peopleOverview,"
          )
          if "additionalChapter('hansen-04-23-people-ppl')" not in text:
              if marker not in text:
                  raise SystemExit('manual-data second timestamp insertion point not found')
              text = text.replace(marker, replacement, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = re.sub(
              r'Сайт разбит на \d+ отдельных маршрутов, объединённых в семь групп:',
              'Сайт разбит на 52 отдельных маршрута, объединённых в семь групп:',
              text,
              count=1,
          )
          text = text.replace(
              'первые главы: 00:39 Production Method, 01:08 Input Data, 02:40 Process 1 TXT2IMG.',
              'главы: 00:39 Production Method, 01:08 Input Data, 02:40 Process 1 TXT2IMG, 04:23 PEOPLE/PPL, 05:42 Workflow Tips, 06:32 ControlNet/Preprocessors, 07:38 Masks & Detail Conservation.',
              1,
          )
          text = re.sub(
              r'Current Hansen timestamp coverage: \*\*[^*]+\*\*\.',
              'Current Hansen timestamp coverage: **00:39 → 07:38**.',
              text,
              count=1,
          )
          p.write_text(text, encoding='utf-8')

          mi = Path('lib/manual/index.ts').read_text(encoding='utf-8')
          md = Path('lib/manual-data.ts').read_text(encoding='utf-8')
          assert 'hansenTimestampChapters02' in mi
          for slug in [
              'hansen-04-23-people-ppl',
              'hansen-05-42-workflow-tips',
              'hansen-06-32-controlnet-preprocessors',
              'hansen-07-38-masks-detail-conservation',
          ]:
              assert md.count(f"additionalChapter('{slug}')") == 1

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Remove temporary finalizer
        run: rm .github/workflows/finalize-hansen-timestamps-02.yml

      - name: Commit finalized timestamp block
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/manual/index.ts lib/manual-data.ts README.md .github/workflows/finalize-hansen-timestamps-02.yml
          git commit -m "feat: add Hansen timestamp lessons 04-23 to 07-38"
          git push
