name: Patch Node Literacy chapter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-node-literacy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Wire Node Literacy route
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected marker not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'lib/manual-data.ts',
              "  additionalChapter('workflow-engineering-overview'),\n  additionalChapter('overview'),",
              "  additionalChapter('workflow-engineering-overview'),\n  additionalChapter('workflow-engineering-node-literacy'),\n  additionalChapter('overview'),",
          )

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('Сайт разбит на 30 отдельных маршрутов', 'Сайт разбит на 31 отдельный маршрут')
          p.write_text(text, encoding='utf-8')

          p = Path('lib/manual/workflow-engineering.ts')
          text = p.read_text(encoding='utf-8')
          old = "    relatedChapters: [\n      'graph-reading',"
          new = "    relatedChapters: [\n      'workflow-engineering-node-literacy',\n      'graph-reading',"
          if new not in text:
              if old not in text:
                  raise SystemExit('Overview relatedChapters marker not found')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify generated route
        shell: bash
        run: |
          test -f dist/client/workflow-engineering-node-literacy.html || \
          test -f dist/client/workflow-engineering-node-literacy/index.html || \
          find dist/client -maxdepth 3 -type f | grep -q 'workflow-engineering-node-literacy'

      - name: Commit patched structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/manual-data.ts lib/manual/workflow-engineering.ts README.md
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "feat: expose Node Literacy in Workflow Engineering"
          git push
